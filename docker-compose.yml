services:
  postgres:
    image: postgres:16-alpine
    container_name: tus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tus_password}
      POSTGRES_DB: ${POSTGRES_DB:-tus_db}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tus} -d ${POSTGRES_DB:-tus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M

  redis:
    image: redis:7-alpine
    container_name: tus-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - tus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  api:
    image: ghcr.io/mussarri/tus-flashcard-api:latest
    container_name: tus-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tus}:${POSTGRES_PASSWORD:-tus_password}@postgres:5432/${POSTGRES_DB:-tus_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      PORT: 5000
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-TUS}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://myrix.site}
      QUESTION_SINGLE_CALL_MODE: ${QUESTION_SINGLE_CALL_MODE:-true}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./api/uploads:/app/uploads
    networks:
      - tus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 500M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
