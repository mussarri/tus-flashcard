services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tus-postgres
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=16MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tus_password}
      POSTGRES_DB: ${POSTGRES_DB:-tus_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 160M

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tus-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  # ============================================
  # NestJS APIService
 # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: tus-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tus}:${POSTGRES_PASSWORD:-tus_password}@postgres:5432/${POSTGRES_DB:-tus_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 5000
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-TUS}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      QUESTION_SINGLE_CALL_MODE: ${QUESTION_SINGLE_CALL_MODE:-true}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./api/uploads:/app/uploads
    networks:
      - tus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Next.js Admin Panel
  # ============================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: production
      args: # <--- BURAYI EKLE
        NEXT_PUBLIC_API_URL: https://myrix.site/tus
    container_name: tus-admin   
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      API_URL: ${API_URL:-http://api:5000}
      BACKEND_URL: ${BACKEND_URL:-http://api:5000}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - tus-network
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 160M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

